name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      EXPO_NO_TELEMETRY: '1'

    steps:
      - name: Checkout mobile repo
        uses: actions/checkout@v4

      - name: Checkout sibling web repo (for core-drift check)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Portugese-for-Kids
          path: web-repo
        continue-on-error: true

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify synced core has no drift
        run: |
          if [ -d "web-repo" ]; then
            node scripts/sync-core.mjs --source ./web-repo --check
          else
            echo "Sibling web repo unavailable in this runner; verifying core files exist."
            test -f core.lock.json
          fi

      - name: TypeScript check
        run: npm run typecheck

      - name: ESLint check
        run: npm run lint

      - name: Run Jest unit tests
        run: npm test -- --ci

      - name: Run Expo Doctor
        run: npx --yes expo-doctor
